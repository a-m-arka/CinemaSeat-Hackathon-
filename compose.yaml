services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_MODE: ${VITE_API_MODE:-remote}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
